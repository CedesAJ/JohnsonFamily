<body>

<header>
    <h1>The Johnson Family</h1>
    <p>The Family of Mary & S.D. Johnson</p>
</header>


<p>All Birthdays</p>

<table id="familyTable">
    <thead>
        <tr>
            <th>Name</th>
            <th>Birth Date</th>
        </tr>
    </thead>
    <tbody></tbody>
</table>

<script>

fetch("family.xlsx")
.then(response => response.arrayBuffer())
.then(data => {

    const workbook = XLSX.read(data, {
        type: "array",
        cellDates: true
    });

    const worksheet = workbook.Sheets[workbook.SheetNames[0]];

    let rows = XLSX.utils.sheet_to_json(worksheet);


    // Sort by Birth Date - oldest first
    rows.sort((a, b) => {

        let dateA = new Date(a["Birth Date"]);
        let dateB = new Date(b["Birth Date"]);

        return dateA - dateB;

    });


    const tbody = document.querySelector("#familyTable tbody");

    rows.forEach(row => {

        let birthDate = row["Birthday"] || "";

        if (birthDate instanceof Date) {
            birthDate = birthDate.toLocaleDateString();
        }

        const tr = document.createElement("tr");

        tr.innerHTML = `
            <td>${row.Name || ""}</td>
            <td>${birthDate}</td>
        `;

        tbody.appendChild(tr);

    });

})
.catch(error => {
    console.error(error);
    alert("Unable to load family.xlsx");
});

</script>
   
<script src="script.js"></script>

</body>
